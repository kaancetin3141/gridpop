# GridPop — nginx site for the static Flutter web build.
#
#   sudo cp deploy/nginx/gridpop.conf /etc/nginx/sites-available/gridpop
#   sudo ln -sf /etc/nginx/sites-available/gridpop /etc/nginx/sites-enabled/gridpop
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# The game is 100% client side: no PHP, Node or database is involved, so this
# one server block is the whole back end.

server {
    listen 80;
    listen [::]:80;

    # Replace with your domain before running certbot (HTTPS cannot be issued
    # for a bare IP). Left as `_` the site answers on any host / the public IP.
    server_name _;

    root /var/www/gridpop;
    index index.html;

    server_tokens off;

    # Flutter ships a ~2.4 MB main.dart.js plus the CanvasKit wasm files.
    # `gzip_static` serves the precompressed .gz files created by the deploy
    # script (no CPU cost per request); dynamic gzip stays as a fallback.
    gzip_static on;
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        application/javascript
        application/json
        application/manifest+json
        application/wasm
        image/svg+xml
        font/ttf
        font/otf;

    # Entry points are not content hashed, so a redeploy must be visible
    # immediately: revalidate instead of caching them.
    location = /index.html {
        expires -1;
    }
    location = /flutter_bootstrap.js {
        expires -1;
    }
    location = /flutter.js {
        expires -1;
    }
    location = /main.dart.js {
        expires -1;
    }
    location = /version.json {
        expires -1;
    }

    # Build assets never change under the same build id.
    location /assets/ {
        expires 30d;
        access_log off;
        try_files $uri =404;
    }
    location /canvaskit/ {
        expires 30d;
        access_log off;
        try_files $uri =404;
    }
    location /icons/ {
        expires 7d;
        access_log off;
        try_files $uri =404;
    }

    # The game has no server side routes; the fallback keeps typo URLs and
    # future deep links on the app shell instead of an nginx error page.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hardening. The app is a self contained game: it is never framed and only
    # talks to its own origin. Keep this list in sync with web/index.html.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' 'wasm-unsafe-eval' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; media-src 'self' data: blob:; connect-src 'self' data: blob:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'none'" always;
}
